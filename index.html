<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EXE Penguin Bonk · preview</title>
<link rel="stylesheet" href="fonts.css"><style>html,body{margin:0;background:#151d2c;color:#eef3fa;font:15px system-ui,sans-serif}main{display:flex;gap:24px;padding:20px;align-items:flex-start;flex-wrap:wrap}canvas{width:400px;height:440px;background:#1d2a3f;border-radius:8px}button{font:700 12px Silkscreen;padding:9px 12px;margin:0 6px 6px 0;border-radius:6px;border:2px solid #f08a24;background:#2b3a55;color:#fff;cursor:pointer}h1{font:700 20px Silkscreen;color:#f6a64a;margin:0 0 8px}</style></head>
<body><main><canvas id="c" width="1000" height="1100"></canvas><div><h1>EXE Penguin Bonk</h1><p>Preview v1.0.1 · nothing here is saved.</p>
<button onclick="go('!penguins give viewer'+(n++%4)+' 1')">Bonk</button><button onclick="go('!penguins rain 20')">Snow rain</button><button onclick="go('!collection viewer0')">Collection</button><p id="v"></p></div></main>
<script src="engine/penguinbonk-presenter.js"></script><script src="engine/penguinbonk-engine.js"></script>
<script>let n=0,BB=null;const go=t=>BB&&BB.onChat('streamer',t,{roles:{broadcaster:true}});
(async()=>{const theme=await (await fetch('theme/theme.json')).json();try{await Promise.all([document.fonts.load('400 8px Silkscreen'),document.fonts.load('700 16px Silkscreen')]);}catch(e){}
BB=BlindBox.create({canvas:document.getElementById('c'),config:{theme,themeBase:'theme/',openCmd:'!bonk',craftCmd:'!fish',modCmd:'!penguins',sound:false,community:true,holdSecs:4}});await BB.READY;document.getElementById('v').textContent='engine '+BlindBox.VERSION+' · presenter '+BlindBoxPresenters.penguinBonk.VERSION;})();</script></body></html>
